services:
  db:
    image: docker.io/library/mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tempdb
      MYSQL_USER: tempuser
      MYSQL_PASSWORD: temppass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: docker.io/larababic/tempconverter:dev
    environment:
      DB_USER: tempuser
      DB_PASS: temppass
      DB_HOST: db
      DB_NAME: tempdb
      STUDENT: "Lara Babić"
      COLLEGE: "Algebra Bernays University"
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure