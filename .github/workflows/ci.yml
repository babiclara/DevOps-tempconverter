name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run unit tests
        run: pytest tests/test_app.py -v -k "unit or zero"

      - name: Start app and db with docker compose
        run: docker compose up -d

      - name: Wait for app to be ready
        run: sleep 20

      - name: Run integration tests
        run: pytest tests/test_app.py -v -k "not unit and not zero"

      - name: Stop containers
        run: docker compose down

      - name: Build container image
        run: docker build -t tempconverter:ci -f Containerfile .